# Build the Arch package from packaging/arch/PKGBUILD (the same one published
# on the AUR) for each pushed release tag, and attach it to a GitHub release.
name: Release Arch package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.94.10.m4
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git and gh
        run: pacman -Syu --noconfirm --needed git github-cli

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # From the commit this workflow runs from (the tag on a push, the
      # default branch on a manual rebuild), so older tags get notes too.
      - name: Extract release notes from CHANGELOG.md
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git show "$GITHUB_SHA:CHANGELOG.md" |
            awk -v tag="$TAG" '
              $0 ~ "^## " { if (found) exit; found = ($2 == tag) ; next }
              found' > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $TAG"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Check the tag matches pkgver
        working-directory: packaging/arch
        run: |
          source ./PKGBUILD
          if [ "$TAG" != "v$pkgver" ]; then
            echo "::error::tag $TAG does not match PKGBUILD pkgver $pkgver"
            exit 1
          fi

      - name: Install build dependencies
        working-directory: packaging/arch
        run: |
          source ./PKGBUILD
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}"

      # makepkg refuses to run as root. The PKGBUILD fetches the driver at
      # this same tag from GitHub, exactly as an AUR build does.
      - name: Build package
        run: |
          useradd -m builder
          # No -debug split package (the image's makepkg.conf enables it).
          echo 'OPTIONS+=(!debug)' > /home/builder/.makepkg.conf
          cp -r packaging/arch /home/builder/build
          chown -R builder: /home/builder/build
          cd /home/builder/build
          sudo -u builder PKGEXT=.pkg.tar.zst makepkg --noconfirm
          mkdir "$GITHUB_WORKSPACE/out"
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/out/"
          cd "$GITHUB_WORKSPACE/out"
          sha256sum ./*.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          cat >> "$notes" <<EOF

          ---
          Install: \`sudo pacman -U libfprint-goodix55b4-*.pkg.tar.zst\`, or from the AUR: \`libfprint-goodix55b4\`.
          EOF
          if gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            # Rebuild: replace the notes and all assets.
            gh release edit "$TAG" -R "$REPO" --notes-file "$notes"
            gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' |
              while read -r asset; do
                gh release delete-asset "$TAG" "$asset" -R "$REPO" --yes
              done
            gh release upload "$TAG" out/* -R "$REPO"
          else
            gh release create "$TAG" out/* -R "$REPO" --title "$TAG" \
              --notes-file "$notes"
          fi
